services:
  takip:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: alan-yogunluk-takibi:latest
    container_name: alan-yogunluk-takibi
    ports:
      - "8000:8000"
    environment:
      OCCUPANCY_HOST: 0.0.0.0
      OCCUPANCY_SOURCE: ornek/demo.mp4
      OCCUPANCY_ZONES_PATH: ornek/zones.json
      OCCUPANCY_LOG_LEVEL: INFO
      # Model ağırlığı adlandırılmış volume'a inip orada kalsın.
      OCCUPANCY_MODEL_PATH: /app/modeller/yolov8n.pt
    volumes:
      # Veritabanı, raporlar ve loglar konteyner silinse de kalsın.
      - ../data:/app/data
      - ../reports:/app/reports
      - ../logs:/app/logs
      - modeller:/app/modeller
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  modeller:
